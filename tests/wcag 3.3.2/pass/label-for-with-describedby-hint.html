<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign up for updates - Passing Example</title>
  <style>
    .form-group { margin-bottom: 24px; }
    .form-control { border: 1px solid #999; padding: 6px; width: 320px; }
    .hint { color: #505a5f; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Sign up for updates</h1>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <!--
          PASS: a persistent visible <label for> names the field, and the format
          instruction is wired to the input with aria-describedby, so both the
          label and the instruction are programmatically determinable and neither
          depends on the field being empty.
        -->
        <label for="email">Email address</label>
        <span class="hint" id="emailHint">Enter it in the format name@example.com</span>
        <input type="email" class="form-control" id="email" aria-describedby="emailHint">
      </div>

      <div class="form-group">
        <label for="postcode">Postcode</label>
        <span class="hint" id="postcodeHint">For example SW1A 1AA</span>
        <input type="text" class="form-control" id="postcode" aria-describedby="postcodeHint" required>
      </div>

      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
