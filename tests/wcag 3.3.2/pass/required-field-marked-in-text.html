<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact us - Passing Example</title>
  <style>
    .form-group { margin-bottom: 24px; }
    .form-control { border: 1px solid #999; padding: 6px; width: 320px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    .required-marker { color: #d4351c; font-weight: normal; }
  </style>
</head>
<body>
  <main>
    <h1>Contact us</h1>

    <!--
      PASS: mandatory fields say so in text inside the label, and carry the
      native `required` attribute so the reader announces the state as well.
      The colour is redundant reinforcement, never the only signal.
    -->
    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="contact-name">Your name <span class="required-marker">(required)</span></label>
        <input type="text" class="form-control" id="contact-name" required>
      </div>

      <div class="form-group">
        <label for="contact-email">Email address <span class="required-marker">(required)</span></label>
        <input type="email" class="form-control" id="contact-email" required>
      </div>

      <div class="form-group">
        <label for="contact-company">Company (optional)</label>
        <input type="text" class="form-control" id="contact-company">
      </div>

      <button type="submit">Send message</button>
    </form>
  </main>
</body>
</html>
