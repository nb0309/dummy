<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Update your details - Failing Example</title>
  <style>
    .form-group { margin-bottom: 24px; }
    .form-control { border: 1px solid #999; padding: 6px; width: 320px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Update your details</h1>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <!--
          FAIL: the <label> has no `for` and does not wrap the input, so the
          association exists only visually. A sighted user sees a labelled field;
          the accessibility tree has an unnamed textbox next to some loose text.
        -->
        <label>Full name</label>
        <input type="text" class="form-control" id="fullname">
      </div>

      <div class="form-group">
        <!-- Same defect: `for` points at an id that does not exist on the page. -->
        <label for="phone-number">Telephone number</label>
        <input type="tel" class="form-control" id="phone">
      </div>

      <button type="submit">Save</button>
    </form>
  </main>
</body>
</html>
