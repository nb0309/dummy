<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manage your claim - Failing Example</title>
  <style>
    section { margin-bottom: 28px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Manage your claim</h1>

    <!--
      FAIL: three buttons that do very different and partly irreversible things,
      all announced as "button, Click here". In a form-controls list they are
      identical, so the only thing distinguishing "report a change" from "cancel
      your claim" is the paragraph above it -- context a rotor list does not carry.
    -->
    <section>
      <h2>Report a change of circumstances</h2>
      <p>Tell us if your income, address or household has changed.</p>
      <button type="button">Click here</button>
    </section>

    <section>
      <h2>Request a statement</h2>
      <p>Get a summary of payments made in the last 12 months.</p>
      <button type="button">Click here</button>
    </section>

    <section>
      <h2>Cancel your claim</h2>
      <p>Close your claim permanently. This cannot be undone.</p>
      <button type="button">Click here</button>
    </section>
  </main>
</body>
</html>
