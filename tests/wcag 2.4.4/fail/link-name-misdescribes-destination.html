<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trade waste services - Failing Example</title>
</head>
<body>
  <main>
    <h1>Trade waste services</h1>

    <!--
      FAIL: every link here is unique, specific and confident-sounding, and every
      one goes somewhere other than what it says. No duplicate check and no
      generic-phrase list will ever catch this — the only thing that does is
      comparing the announced name against the href.

      This is why 2.4.4 cannot be reduced to "flag repeated link text": a page can
      have no repetition at all and still tell every user the wrong thing about
      where they are going.
    -->
    <p>Our current charges are published each April.
      <a href="/contact-us">Download the 2024 price list (PDF)</a>.</p>

    <p>Existing customers can manage their account online.
      <a href="/trade-waste/apply">Sign in to your account</a>.</p>

    <p>Collections are suspended on bank holidays.
      <a href="/trade-waste/prices">Check the bank holiday timetable</a>.</p>
  </main>
</body>
</html>
