<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Choose a service</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    select, input { border: 1px solid #999; padding: 6px; width: 260px; }
    .form-group { margin-bottom: 20px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a service</h1>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="reference">Your reference</label>
        <input type="text" id="reference" />
      </div>

      <!--
        PASS: the same jump menu, fixed the way it should be fixed. Changing the
        selection does nothing at all — the user browses the options freely, arrows up
        and down, changes their mind — and navigation happens only when they press Go.
        Activating a button is a change of context the user REQUESTED, which 3.2.2
        permits outright and 3.2.5 governs.

        Worth contrasting with ../pass/select-navigates-on-change-with-warning.html:
        that one conforms by warning, this one conforms by not doing it. Both pass;
        only this one leaves the user in control.
      -->
      <div class="form-group">
        <label for="service">Service</label>
        <select id="service">
          <option value="">Choose a service</option>
          <option value="/renew">Renew a licence</option>
          <option value="/apply">Apply for a licence</option>
        </select>
        <button type="button" id="go">Go</button>
      </div>

      <div class="form-group">
        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" />
      </div>

      <button type="submit">Continue</button>
    </form>
  </main>

  <script>
    var service = document.getElementById("service");
    document.getElementById("go").addEventListener("click", function () {
      if (service.value) window.location.href = service.value;
    });
  </script>
</body>
</html>
