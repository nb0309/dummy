<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Choose a service</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    select, input { border: 1px solid #999; padding: 6px; width: 260px; }
    .form-group { margin-bottom: 20px; }
    .warning { color: #0b0c0c; font-size: 0.95em; margin: 0 0 6px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a service</h1>
    <p><a href="/help">Get help choosing</a></p>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="reference">Your reference</label>
        <input type="text" id="reference" />
      </div>

      <!--
        PASS, and the decisive case for this criterion. The select navigates on change
        exactly as ../fail/select-navigates-on-change.html does — same handler, same
        effect, same measurement from the probe. It conforms because of 3.2.2's own
        exception: the user is advised of the behaviour BEFORE using the component.

        The warning is doing real work here, not decoration. It is associated with the
        select through aria-describedby, so a screen reader announces it as part of the
        control rather than leaving it to be stumbled across, and it sits before the
        select in reading order so it is heard on the way in rather than on the way out.

        This fixture exists to hold the line that the behaviour alone does not decide
        3.2.2 — the warning does.
      -->
      <div class="form-group">
        <label for="service">Service</label>
        <p class="warning" id="service-warning">
          Selecting a service takes you straight to that service's page.
        </p>
        <select id="service" aria-describedby="service-warning">
          <option value="">Choose a service</option>
          <option value="/renew">Renew a licence</option>
          <option value="/apply">Apply for a licence</option>
        </select>
      </div>

      <div class="form-group">
        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" />
      </div>

      <button type="submit">Continue</button>
    </form>
  </main>

  <script>
    var service = document.getElementById("service");
    service.addEventListener("change", function () {
      if (service.value) window.location.href = service.value;
    });
  </script>
</body>
</html>
