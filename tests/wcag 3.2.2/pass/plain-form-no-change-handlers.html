<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register for updates</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { border: 1px solid #999; padding: 6px; width: 300px; }
    .form-group { margin-bottom: 20px; }
    .hint { color: #505a5f; font-size: 0.9em; margin: 0 0 4px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <!--
    PASS: the baseline. No scripts at all, so no control can do anything when its
    setting changes. Included because 3.2.2 can only be violated by something that
    runs on input, and a suite made entirely of change handlers would never show what
    their absence looks like.
  -->
  <main>
    <h1>Register for updates</h1>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="email">Email address</label>
        <p class="hint" id="email-hint">We will only use this to send you updates.</p>
        <input type="email" id="email" aria-describedby="email-hint" />
      </div>

      <div class="form-group">
        <label for="topic">Topic</label>
        <select id="topic">
          <option>Planning</option>
          <option>Licensing</option>
        </select>
      </div>

      <div class="form-group">
        <input type="checkbox" id="confirm" />
        <label for="confirm">I confirm I am over 16</label>
      </div>

      <div class="form-group">
        <label for="notes">Anything else?</label>
        <textarea id="notes" rows="3"></textarea>
      </div>

      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
