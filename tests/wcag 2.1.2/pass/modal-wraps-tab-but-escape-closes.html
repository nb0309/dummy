<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Confirm your booking</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    main { padding: 16px; }
    .overlay { position: fixed; inset: 0; background: rgba(11, 12, 12, 0.6); }
    .dialog {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      width: 380px; background: #fff; border: 4px solid #0b0c0c; padding: 20px;
    }
    .dialog h2 { margin-top: 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { border: 1px solid #999; padding: 6px; width: 100%; }
    button { margin-top: 16px; padding: 8px 12px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Your booking</h1>
    <p>Two nights, 14 to 16 August, Room 402.</p>
    <p><a href="/bookings">Back to your bookings</a></p>
    <button type="button" id="opener">Confirm this booking</button>
  </main>

  <!--
    PASS: this dialog cycles Tab exactly as ../fail/modal-traps-tab-with-no-escape.html
    does, and that is correct — a modal is supposed to contain focus while it is
    open. It conforms because there is a way out with the keyboard: Escape closes
    the dialog and returns focus to the button that opened it, and a Cancel button
    inside the loop does the same. This fixture exists to hold the line that
    detecting a focus cycle is NOT by itself a 2.1.2 finding; the absence of an
    exit is.
  -->
  <div class="overlay" id="overlay"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="dialog-title" id="booking-dialog" class="dialog">
    <h2 id="dialog-title">Confirm your booking</h2>
    <p>Enter a promotion code if you have one, then confirm.</p>
    <label for="promo">Promotion code</label>
    <input type="text" id="promo" />
    <button type="button" id="confirm">Confirm booking</button>
    <button type="button" id="cancel">Cancel</button>
  </div>

  <script>
    var dialog = document.getElementById("booking-dialog");
    var overlay = document.getElementById("overlay");
    var opener = document.getElementById("opener");
    var firstControl = document.getElementById("promo");
    var lastControl = document.getElementById("cancel");

    function closeDialog() {
      dialog.hidden = true;
      overlay.hidden = true;
      opener.focus();
    }

    dialog.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeDialog();
        return;
      }
      if (event.key !== "Tab") return;
      if (event.shiftKey && document.activeElement === firstControl) {
        event.preventDefault();
        lastControl.focus();
      } else if (!event.shiftKey && document.activeElement === lastControl) {
        event.preventDefault();
        firstControl.focus();
      }
    });

    document.getElementById("cancel").addEventListener("click", closeDialog);
  </script>
</body>
</html>
