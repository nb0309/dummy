<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Report a repair</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, textarea { border: 1px solid #999; padding: 6px; width: 320px; }
    .form-group { margin-bottom: 20px; padding: 8px; border-left: 4px solid transparent; }
    .form-group.active { border-left-color: #1d70b8; background: #f3f2f1; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Report a repair</h1>

    <form onsubmit="event.preventDefault()">
      <!--
        PASS: focusing a field highlights its wrapper by adding a class. The probe
        records attribute mutations and nothing else — no node is added, focus stays
        put, and nothing navigates, opens or submits. A visual emphasis on the field
        the user is in is presentation, not context: it changes how the page looks and
        not what it means or where the user is.
      -->
      <div class="form-group" id="group-location">
        <label for="location">Where is the repair needed?</label>
        <input type="text" id="location" />
      </div>

      <div class="form-group" id="group-details">
        <label for="details">Describe the problem</label>
        <textarea id="details" rows="3"></textarea>
      </div>

      <button type="submit">Report repair</button>
    </form>
  </main>

  <script>
    var fields = document.querySelectorAll("#location, #details");
    [].forEach.call(fields, function (field) {
      var group = field.closest(".form-group");
      field.addEventListener("focus", function () {
        group.classList.add("active");
      });
      field.addEventListener("blur", function () {
        group.classList.remove("active");
      });
    });
  </script>
</body>
</html>
