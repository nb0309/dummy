<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Choose a service</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    select, input { border: 1px solid #999; padding: 6px; width: 260px; }
    .form-group { margin-bottom: 20px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a service</h1>
    <p><a href="/help">Get help choosing</a></p>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="reference">Your reference</label>
        <input type="text" id="reference" />
      </div>

      <!--
        FAIL: the jump menu navigates the moment the select RECEIVES focus, before the
        user has chosen anything. A keyboard user tabbing through the form is taken off
        the page on the way past, and can never reach the fields below. Note that the
        same navigation wired to `change` instead would be 3.2.2's question, not
        3.2.1's — compare ../pass/navigation-on-activation-not-focus.html.
      -->
      <div class="form-group">
        <label for="service">Service</label>
        <select id="service">
          <option value="/renew">Renew a licence</option>
          <option value="/apply">Apply for a licence</option>
        </select>
      </div>

      <div class="form-group">
        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" />
      </div>

      <button type="submit">Continue</button>
    </form>
  </main>

  <script>
    var service = document.getElementById("service");
    service.addEventListener("focus", function () {
      window.location.href = service.value;
    });
  </script>
</body>
</html>
