<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Request a callback - Failing Example</title>
  <style>
    .form-group { margin-bottom: 24px; }
    .form-control { border: 1px solid #999; padding: 6px; width: 320px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Request a callback</h1>

    <!--
      FAIL: positive tabindex values impose an order that has nothing to do with
      the order the fields are read or displayed in. Tabbing goes Phone number ->
      Best time -> Your name, so the user is thrown into the middle of the form,
      back to the end, then up to the top. The visual order and the DOM order both
      say Your name first.
    -->
    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="name">Your name</label>
        <input type="text" class="form-control" id="name" tabindex="3">
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" class="form-control" id="phone" tabindex="1">
      </div>

      <div class="form-group">
        <label for="besttime">Best time to call</label>
        <input type="text" class="form-control" id="besttime" tabindex="2">
      </div>

      <button type="submit" tabindex="4">Request callback</button>
    </form>
  </main>
</body>
</html>
