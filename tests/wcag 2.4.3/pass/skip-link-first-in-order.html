<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Guidance - Passing Example</title>
  <style>
    body { margin: 0; }
    .skip-link { display: block; padding: 8px 16px; background: #ffdd00; color: #0b0c0c; }
    nav { background: #f3f2f1; padding: 12px 16px; }
    nav a { margin-right: 16px; }
    main { padding: 16px; }
  </style>
</head>
<body>
  <!--
    PASS: the skip link is the first thing in the DOM and the first thing on
    screen, so it is also the first tab stop -- which is the only position that
    makes it useful. It targets a real, focusable landmark (main has tabindex="-1"
    so it can receive programmatic focus without joining the tab sequence itself),
    and after it the order runs straight down the page: nav links, then content.
  -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav aria-label="Sections">
    <a href="/guidance/start">Getting started</a>
    <a href="/guidance/rules">The rules</a>
    <a href="/guidance/appeals">Appeals</a>
  </nav>

  <main id="main-content" tabindex="-1">
    <h1>Guidance</h1>
    <p>Read the rules before you apply.</p>
    <p><a href="/apply">Start your application</a></p>
  </main>
</body>
</html>
