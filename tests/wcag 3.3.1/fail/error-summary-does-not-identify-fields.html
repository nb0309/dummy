<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Book an appointment - Failing Example</title>
  <style>
    .form-group { margin-bottom: 24px; }
    .summary { display: none; border: 4px solid #d4351c; padding: 12px; color: #d4351c; }
  </style>
  <script>
    function book(e) {
      e.preventDefault();
      var email = document.getElementById("email");
      var phone = document.getElementById("phone");
      var bad = email.value.indexOf("@") === -1 || phone.value.length < 11;
      if (bad) {
        // FAIL: there IS text, and it is even in a summary at the top of the
        // form -- but it never identifies WHICH field is in error, nor WHAT is
        // wrong with it. The user is told only that a problem exists somewhere.
        document.getElementById("summary").style.display = "block";
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>Book an appointment</h1>

    <form onsubmit="book(event)">
      <div class="summary" id="summary">
        There is a problem with your submission. Please check your answers and try again.
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="text" id="email" data-error-fill="jordan.example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="text" id="phone" data-error-fill="0777">
      </div>

      <button type="submit" data-error-trigger>Book appointment</button>
    </form>
  </main>
</body>
</html>
