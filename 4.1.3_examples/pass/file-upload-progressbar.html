<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Upload Photo - Passing Example</title>
  <style>
    .bar { width: 240px; height: 12px; background: #eee; margin-top: 12px; }
    .bar__fill { height: 100%; background: #0a6; }
  </style>
  <script>
    function upload(e) {
      e.preventDefault();
      var pb = document.getElementById("progress");
      pb.setAttribute("aria-valuenow", "60");
      pb.querySelector(".bar__fill").style.width = "60%";
      pb.querySelector(".pct").textContent = "60% uploaded";
    }
  </script>
</head>
<body>
  <h1>Upload a photo</h1>

  <form onsubmit="upload(event)">
    <label>Choose image:</label>
    <input type="file" id="img">
    <button type="submit" data-status-trigger>Upload</button>

    <!-- PASS: progress is exposed via role="progressbar" with value attributes,
         starting at 0% and moving to 60% on submit — the change is what 4.1.3
         is about. NOTE: role="progressbar" is not itself a live region, so the
         announcement probe reads SILENT here even though the markup is a valid
         4.1.3 mechanism. This is the one case where the probe cannot be the
         deciding signal and the classifier falls back to markup; see the
         progressbar fallback in src/skills/status_msg_4_1_3.md. -->
    <div id="progress" class="bar" role="progressbar" aria-valuenow="0"
         aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress"
         data-status-target>
      <div class="bar__fill" style="width:0%"></div>
      <span class="pct">0% uploaded</span>
    </div>
  </form>
</body>
</html>
