<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Job Search - Passing Example</title>
  <style>
    .results-count { margin: 12px 0; color: #333; }
    .job { padding: 6px 0; border-bottom: 1px solid #ddd; }
  </style>
  <script>
    function search(e) {
      e.preventDefault();
      // aria-live="polite" region -> the new count is announced without focus.
      document.getElementById("count").textContent = "3 jobs found";
    }
  </script>
</head>
<body>
  <h1>Search jobs</h1>

  <form onsubmit="search(event)">
    <label>Keyword:</label>
    <input type="search" id="q" value="designer">
    <button type="submit" data-status-trigger>Search</button>
  </form>

  <!-- PASS: results count is an aria-live="polite" region, so updates are
       announced to screen-reader users without moving focus. The region is
       present but empty on load so the search result is a genuine change. -->
  <div id="count" class="results-count" aria-live="polite" data-status-target></div>

  <div class="job">Product Designer</div>
  <div class="job">UX Designer</div>
  <div class="job">Visual Designer</div>
</body>
</html>
